serenity {
    project.name = "Serenity E2E Automation"
    take.screenshots = FOR_FAILURES
    restart.browser.for.each = feature
    test.root = "features"
}

headless.mode = false

webdriver {
  driver = "firefox"

  capabilities {
    browserName = "firefox"

    "moz:firefoxOptions" {
      args = [
        "--width=1000",
        "--height=800"
      ]
    }
  }
}

environments {
    default {
        webdriver.base.url = "http://localhost:5173/"
    }
}