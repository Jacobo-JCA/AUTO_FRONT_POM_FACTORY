serenity {
    project.name = "Serenity E2E Automation"
    take.screenshots = FOR_FAILURES
    restart.browser.for.each = feature
    test.root = "features"
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["test-type", "no-sandbox", "ignore-certificate-errors", "--window-size=1920,1080",
        "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
    }
  }
}

environments {
    default {
        webdriver.base.url = "http://localhost:5173/"
    }
}